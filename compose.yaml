# Run N copies of the app behind one load balancer:
#   docker compose up --build --scale web=3
# then open http://localhost:8080
services:
  web:
    build: .
    cpus: 2        # a fixed share per container, so adding containers adds capacity (fair scaling tests)
    environment:
      # match the math libraries' thread pools to the CPU share, or they fight over cores they do not have
      OMP_NUM_THREADS: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
    volumes:
      - instance:/app/instance   # users, photos, uploads, models and the session key, shared by all containers
    expose:
      - "8000"

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      web:
        condition: service_healthy   # start only once EVERY web container is up, so nginx sees them all

volumes:
  instance:
