events {}

http {
    client_max_body_size 512m;

    # nginx looks up "web" once at start and balances across every container it finds.
    # After changing the number of containers:  docker compose restart proxy
    upstream faceunlock {
        least_conn;
        server web:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://faceunlock;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
    }
}
